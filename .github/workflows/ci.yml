name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Engine tests (incl. official golden cases)
        run: pnpm test
      - name: Data validation (Accuracy Policy gate)
        run: pnpm validate:data
      - name: Build web app
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E smoke tests
        run: pnpm test:e2e
