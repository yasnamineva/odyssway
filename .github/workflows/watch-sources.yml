name: Watch official sources

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read # download the previous run's snapshots

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Last week's page text, so a change is reported with the sentences that changed.
      # Kept as an artifact, not in the repo: these are copies of other governments' pages.
      - name: Restore previous snapshots
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: watch-sources.yml
          name: source-snapshots
          path: source-snapshots
          if_no_artifact_found: warn
      - run: pnpm watch:sources
        env:
          SOURCE_SNAPSHOT_DIR: ${{ github.workspace }}/source-snapshots
      - name: Keep snapshots for next week
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshots
          path: source-snapshots
          retention-days: 90
      - name: Open PR when sources changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: official source change report"
          title: "Official source change detected — human review required"
          body: >
            scripts/watch-sources.ts detected changes in watched official
            sources. Review the report in data/UNVERIFIED/, update affected
            data files, and bump verified_at.
          branch: source-watch/report
          add-paths: |
            data/source-hashes.json
            data/UNVERIFIED/source-changes-*.md
